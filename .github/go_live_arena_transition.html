uniform vec2 u_resolution;

float noise(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);

float smoothNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = noise(i);
    float b = noise(i + vec2(1.0, 0.0));
    float c = noise(i + vec2(0.0, 1.0));

        // Immersive glitch and countdown logic
        document.addEventListener('DOMContentLoaded', () => {
            const timerEl = document.getElementById('countdown-timer');
            const statusBadge = document.getElementById('status-badge');
            let count = 3;

            // Glitch effect sequence
            const glitchChars = '!<>-_\\/[]{}—=+*^?#_';
            
            function glitchText(element, finalValue, duration = 300) {
                let iterations = 0;
                const maxIterations = 10;
                const interval = setInterval(() => {
                    element.innerText = element.innerText.split('').map((char, index) => {
                        if (index < iterations / (maxIterations / finalValue.length)) {
                            return finalValue[index];
                        }
                        return glitchChars[Math.floor(Math.random() * glitchChars.length)];
                    }).join('');
                    
                    if (iterations >= maxIterations) {
                        clearInterval(interval);
                        element.innerText = finalValue;
                    }
                    iterations++;
                }, duration / maxIterations);
            }

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    glitchText(timerEl, count.toString(), 200);
                } else if (count === 0) {
                    clearInterval(countdownInterval);
                    timerEl.style.fontSize = '64px';
                    timerEl.classList.replace('text-inverse-surface', 'text-primary-fixed-dim');
                    glitchText(timerEl, 'LIVE', 400);
                    
                    // Update status
                    statusBadge.innerHTML = `
                        <div class="w-2 h-2 rounded-full bg-error animate-pulse shadow-[0_0_8px_rgba(255,180,171,0.8)]"></div>
                        <span class="font-label-sm text-label-sm text-error uppercase tracking-widest">Recording...</span>
                    `;
                    
                    // Hide cancel button smoothly
                    const cancelBtn = document.getElementById('cancel-btn');
                    cancelBtn.style.opacity = '0';
                    cancelBtn.style.pointerEvents = 'none';
                }
            }, 1000);
        });
    </script>

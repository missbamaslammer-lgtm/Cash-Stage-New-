<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_35" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_35');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Stem Previewer Animation
// Visualizes audio stems with interactive geometric waveforms

const scene = new THREE.Scene();
const containerWidth = container.clientWidth || window.innerWidth;
const containerHeight = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, containerWidth / containerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(containerWidth, containerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x39ff14, 1, 100);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Waveform Geometry (Interactive Bars)
const bars = [];
const barCount = 32;
const group = new THREE.Group();

for (let i = 0; i < barCount; i++) {
    const geometry = new THREE.BoxGeometry(0.2, 1, 0.2);
    const material = new THREE.MeshPhongMaterial({ 
        color: 0x39ff14,
        transparent: true,
        opacity: 0.8
    });
    const bar = new THREE.Mesh(geometry, material);
    bar.position.x = (i - barCount / 2) * 0.4;
    group.add(bar);
    bars.push(bar);
}
scene.add(group);

camera.position.z = 10;

// Render Loop
function animate(t) {
    requestAnimationFrame(animate);
    
    const time = t * 0.001;
    
    bars.forEach((bar, i) => {
        const freq = Math.sin(time * 2 + i * 0.5) * 2 + 2.5;
        bar.scale.y = freq;
        bar.material.opacity = 0.4 + (freq / 5) * 0.6;
    });
    
    group.rotation.y = Math.sin(time * 0.2) * 0.2;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate(0);

})();
</script>
